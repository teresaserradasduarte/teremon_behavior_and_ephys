<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS curation browser</title>
<!-- Template for step0_explore_session.py (section 8b). step0 copies it to <OUT_DIR>/browser.html and writes the
     data to <OUT_DIR>/browser_data.js. Edit this file and copy it over browser.html to change the page. -->
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --ink: #1d1d22; --muted: #6b6b76; --line: #e2e2e7;
  --cb: #9a7bc1; --cb-soft: #ede6f6; --tier2: #8c8c8c; --blue: #3380cc;
  --plus: #9fd49f; --minus: #eea0a0; --zero: #ebebeb;
  --shade: #e4e4e4; --shade2: #f1f1f1;
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; }
header .meta { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button, .ctl button { border: 1px solid var(--line); background: var(--panel); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--cb); color: white; border-color: var(--cb); }
#app { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 46px); }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; max-height: calc(100vh - 46px); position: sticky; top: 46px; }
aside .filters { padding: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
aside select { font: inherit; }
.cs-row { padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 44px 1fr; gap: 2px 6px; }
.cs-row:hover { background: var(--shade2); }
.cs-row.on { background: var(--cb-soft); border-left: 3px solid var(--cb); }
.cs-row .id { font-weight: 600; }
.cs-row .sub { color: var(--muted); font-size: 11px; grid-column: 2; }
.badge { display: inline-block; padding: 0 5px; border-radius: 8px; font-size: 10.5px; margin-right: 3px; background: var(--zero); }
.badge.t1 { background: var(--cb); color: white; } .badge.t2 { background: var(--tier2); color: white; }
tr.weakrow td { color: #888; }
.badge.fam { background: #f3d9a8; } .badge.none { background: #f6dede; }
main { padding: 12px 16px 40px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; padding-right: 22px; }
.card { position: relative; }
.infoi { position: absolute; top: 6px; right: 8px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #9a9aa6;
        color: #6b6b76; font: italic 700 11px/14px Georgia, serif; text-align: center; cursor: help; background: #fff; z-index: 3; user-select: none; }
.infoi:hover, .infoi:focus { background: var(--cb); border-color: var(--cb); color: #fff; outline: none; }
.infoi .pop { display: none; position: absolute; right: -2px; top: 100%; width: min(480px, 78vw); max-height: 65vh; overflow: auto;
             background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.18);
             padding: 10px 12px; font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; font-style: normal; text-align: left;
             white-space: normal; cursor: auto; z-index: 60; }
.infoi:hover .pop, .infoi:focus .pop, .infoi:focus-within .pop { display: block; }
.infoi .pop p { margin: 0 0 6px; } .infoi .pop p:last-child { margin: 0; }
.infoi.inline { position: relative; top: auto; right: auto; display: inline-block; margin-left: 6px; vertical-align: 1px; }
.infoi.inline .pop { left: 0; right: auto; top: 100%; }
.card .note { color: var(--muted); font-size: 11.5px; }
.wide { grid-column: 1 / -1; }
.span2 { grid-column: span 2; }
.ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; }
.ctl label { color: var(--muted); }
.ctl select { font: inherit; }
table { border-collapse: collapse; font-size: 11.5px; }
th, td { padding: 3px 6px; border: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { background: var(--shade2); font-weight: 600; position: sticky; top: 0; }
td.plus { background: var(--plus); } td.minus { background: var(--minus); } td.zero { background: var(--zero); }
td.info.plus { background: #d6ecd6; } td.info.minus { background: #f6d6d6; }
tr.click { cursor: pointer; } tr.click:hover td { outline: 1px solid var(--cb); }
tr.sel td { box-shadow: inset 0 0 0 2px var(--cb); }
td.selcol, th.selcol { box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); }
.ccgs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.ccg-cell { cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; background: var(--panel); }
.ccg-cell.cand .t { color: var(--cb); font-weight: 600; }
.ccg-cell.sel { box-shadow: 0 0 0 2px var(--cb); }
.ccg-cell .t { font-size: 11px; }
pre.card-text { margin: 0; font: 11.5px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
svg text { font: 10px system-ui, sans-serif; fill: var(--ink); }
svg .ax { stroke: #444; stroke-width: 1; fill: none; }
svg .tick { stroke: #444; stroke-width: 1; }
svg .muted { fill: var(--muted); }
.table-wrap { overflow: auto; max-height: 520px; }
.hint { color: var(--muted); font-size: 11.5px; margin: 2px 0 8px; }
.badge.raw { background: #d8e8f6; } .badge.warn { background: #b3261e; color: white; }
img.fig { width: 100%; height: auto; border-radius: 4px; display: block; }
.figlinks a { margin-right: 10px; font-size: 11.5px; color: var(--blue); }
.kpi { display: flex; gap: 18px; flex-wrap: wrap; margin: 2px 0 4px; }
.kpi div { display: flex; flex-direction: column; } .kpi b { font-size: 17px; font-weight: 600; } .kpi span { color: var(--muted); font-size: 11px; }
details.card > summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; background: var(--shade2); }
</style>
</head>
<body>
<header>
  <h1>CS curation browser</h1>
  <span class="meta" id="meta"></span>
  <div class="tabs" id="tabs"></div>
</header>
<div id="app">
  <aside>
    <div class="filters">
      <select id="f-show">
        <option value="all">all CS</option><option value="matched">with SS partner</option>
        <option value="unmatched">no SS partner</option><option value="family">in a duplicate family</option>
        <option value="dup">with any CS–CS pair</option>
      </select>
      <select id="f-sort"><option value="y">sort: depth</option><option value="id">sort: phyID</option></select>
    </div>
    <div id="cslist"></div>
  </aside>
  <main id="main"></main>
</div>
<script src="browser_data.js"></script>
<!-- optional raw-data layer (raw_waveforms_session.py, one session at a time); absent for most sessions -->
<script src="../raw_waveforms/raw_data.js" onerror="window.CS_RAW = null"></script>
<!-- optional: single raw events of CS–CS pairs (raw_dup_events.py) -->
<script src="../raw_waveforms/raw_dup_events.js" onerror="window.CS_RAW_DUPEV = null"></script>
<!-- optional: are two SS partners of one CS the same cell? (ss_same_cell_check.py) -->
<script src="../ss_same_cell/ss_same_cell.js" onerror="window.CS_SSPAIR = null"></script>
<script>
"use strict";
const D = window.CS_DATA;
if (!D) document.getElementById("main").innerHTML =
  "<p>browser_data.js not found next to this file. Re-run step0 (section 8b).</p>";
const P = D.params;
const NS = "http://www.w3.org/2000/svg";
const COL = { cb: "#9a7bc1", t2: "#8c8c8c", blue: "#3380cc", ink: "#1d1d22", grey: "#9a9a9a",
              shade: "#e4e4e4", shade2: "#f1f1f1", dot: "rgba(40,40,40,0.25)" };
const EV_LINES = ["coinc", "lag_sd", "union", "ss_shared", "ss_cond", "footprint", "covar"];
const EV_LABELS = { coinc: "coincidence", lag_sd: "lag jitter", union: "union ISIs", ss_shared: "shared SS",
                    ss_cond: "co-silencing", footprint: "footprint", covar: "amp/depth covar" };
const EV_HELP = {
  coinc: `fraction of the smaller unit's spikes within ±${P.COINC_DELTA * 1e3} ms of the peak lag: ≥ ${P.EV_COINC[0]} → +1, < ${P.EV_COINC[1]} → −1`,
  lag_sd: `robust SD of the coincident lag: ≤ ${P.EV_LAG_SD[0] * 1e3} ms → +1, ≥ ${P.EV_LAG_SD[1] * 1e3} ms → −1 (votes only if coinc ≥ ${P.EV_COINC[1]})`,
  union: `new ${P.UNION_ISI_RANGE[0] * 1e3}–${P.UNION_ISI_RANGE[1] * 1e3} ms ISIs after merging / expected for independent trains: ≤ ${P.EV_UNION_NEW[0]} → +1, ≥ ${P.EV_UNION_NEW[1]} → −1`,
  ss_shared: "both units pause the same SS candidate → +1; both have partners but none shared → −1",
  ss_cond: `pause of one unit's own SS partner after the OTHER unit's non-coincident spikes: ≤ ${P.EV_COND_PR[0]} → +1, ≥ ${P.EV_COND_PR[1]} → −1`,
  footprint: `template footprint cosine (≥ ${P.FOOTPRINT_MIN_OVERLAP} shared channels): ≥ ${P.EV_FOOTPRINT[0]} → +1, ≤ ${P.EV_FOOTPRINT[1]} → −1`,
  covar: `|detrended amplitude corr| or depth corr of coincident spikes ≥ ${P.EV_COVAR} → +1 (never −1)`,
};
// candidate criteria (all four make "candidate") and info-only columns, mirroring step0
const GRID = [
  { h: `pause ${+(P.PAUSE_WIN[0] * 1e3).toFixed(1)}–${+(P.PAUSE_WIN[1] * 1e3).toFixed(1)}`, k: "pause_ratio", ok: v => v < P.CAND_PAUSE_RATIO_MAX, crit: true, nd: 2 },
  { h: "asym", k: "asym", ok: v => v > P.CAND_ASYM_MIN, crit: true, nd: 2 },
  { h: "jitter p", k: "jitter_p", ok: v => v < P.CAND_JITTER_P_MAX, crit: true, nd: 3 },
  { h: "no dip", k: "collision_dip", ok: v => !v, crit: true },
  { h: "blocks max", k: "block_pr_max", ok: v => v < P.CAND_PAUSE_RATIO_MAX, crit: false, nd: 2 },
  { h: "dur50 ms", k: "pause_dur50_ms", ok: v => v >= 3, crit: false, nd: 0 },
  { h: "zero peak", k: "zero_peak_ratio", ok: v => v < 2, crit: false, nd: 2 },
  { h: "Lussac", k: "lussac_pass", ok: v => !!v, crit: false },
  // CS-spike sharing: flag only (never part of "candidate"); ✗ = this "SS" carries > CS_SHARE_FLAG of the CS spikes
  { h: "CS shared", k: "cs_share_excess", ok: v => !(v > P.CS_SHARE_FLAG), crit: false, nd: 2 },
  // v6: SS spikes inside the CS event (−0.5…+4 ms) beyond chance; ✗ = this "SS" carries pieces of the CS event (flag only)
  ...(P.CS_EVENT_FLAG !== undefined ? [
    { h: "CS event", k: "cs_event_excess", ok: v => !(v > P.CS_EVENT_FLAG), crit: false, nd: 2 },
    { h: "pr 0–8 (v5)", k: "pause_ratio_0_8", ok: v => v < P.CAND_PAUSE_RATIO_MAX, crit: false, nd: 2 }] : []),
];
const V6 = P.CS_EVENT_FLAG !== undefined;
const DECOMP = D.decomp || [], LOWFR = D.lowfr || [];
DECOMP.forEach(r => { if (r.strong === undefined) r.strong = r.excess > P.CS_EVENT_FLAG || r.mostly_cs_pieces; });
const decompOf = cs => DECOMP.filter(r => r.cs === cs);
const curRank1 = cs => pairsOfCs(cs).find(p => p.rank === 1)?.ss;
const FUNNEL = [
  [`pause ratio < ${P.CAND_PAUSE_RATIO_MAX}`, p => p.pause_ratio < P.CAND_PAUSE_RATIO_MAX],
  [`asym > ${P.CAND_ASYM_MIN}`, p => p.asym > P.CAND_ASYM_MIN],
  [`jitter p < ${P.CAND_JITTER_P_MAX}`, p => p.jitter_p < P.CAND_JITTER_P_MAX],
  ["no collision dip", p => !p.collision_dip],
];

// ---------- state (mirrored in the URL hash, so a view can be reloaded or bookmarked) ----------
const S = { cs: D.cs_ids[0], tab: "overview", ss: null, pair: null, rank: "rank", topn: 8, bin: 1, win: 50,
            tcand: true, tthis: true, weak: false, sortk: null, sortasc: true, osum: false, rawk: null, rawss: null, rawdup: null, dupset: "coincident", sspair: null };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const [k, v] of h) {
    if (!(k in S)) continue;
    S[k] = ["cs", "ss", "pair", "topn", "bin", "win", "rawk", "rawss", "rawdup"].includes(k) ? (v === "" || v === "null" ? null : +v)
         : ["tcand", "tthis", "sortasc", "osum", "weak"].includes(k) ? v === "true" : v;
  }
  if (!D.cs_ids.includes(S.cs)) S.cs = D.cs_ids[0];
}
function writeHash() {
  const keep = ["cs", "tab", "ss", "pair", "rank", "topn", "bin", "win", "osum", "rawk", "rawss", "rawdup", "dupset", "sspair"];
  history.replaceState(null, "", "#" + keep.map(k => `${k}=${S[k] ?? ""}`).join("&"));
}

// ---------- small helpers ----------
const fmt = (v, nd = 2) => v === null || v === undefined || (typeof v === "number" && !isFinite(v)) ? "–"
  : typeof v === "boolean" ? (v ? "y" : "n") : typeof v === "number" ? v.toFixed(nd) : String(v);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
// ---------- ⓘ help: one hover note per card, matched on the card title (first matching pattern wins) ----------
// Each entry: [regex on the title, () => HTML]. Numbers come from the parameters of THIS run (P) or of the raw layer.
const ms = v => +(v * 1e3).toFixed(2);
const PW = () => `${ms(P.PAUSE_WIN[0])}–${ms(P.PAUSE_WIN[1])} ms`;
const BW = () => `${ms(P.BASELINE_WIN[0])}…${ms(P.BASELINE_WIN[1])} ms`;
const RM = () => (window.CS_RAW || {}).meta || {};
const H = (what, how, read) => `<p><b>What:</b> ${what}</p>` + (how ? `<p><b>How:</b> ${how}</p>` : "") + (read ? `<p><b>Read it:</b> ${read}</p>` : "");
const PR_DEF = () => `pause ratio = mean SS rate ${PW()} after the CS ÷ SS baseline rate (${BW()} before the CS), from the coarse CCG (${ms(P.COARSE_BIN)} ms bins). 0 = complete silence, 1 = no change`;
const INFO = [
  // ----- sidebar / header
  [/^__sidebar$/, () => H("<b>Left list:</b> one row per CS unit of this session (role CS = C4 label PkC_cs in the cerebellum). Click a row to show that CS in every tab; ↑/↓ also step through the list.",
    "Badges: <b>SS t1 ×n</b> / <b>SS t2 ×n</b> = number of SS partner candidates (tier 1 = extra-good non-CS units; tier 2 = any other unit, any label, firing ≥ " + P.SS2_FR_MIN + " Hz). <b>no SS</b> = no candidate. <b>fam</b> = member of a duplicate family (CS units that may be the same cell; never merged). <b>pieces ×n</b> = clusters that fire inside this CS's event (spike-time decomposition). <b>spk x · n cap</b> (raw sessions only) = raw spikelets per event above the random-time rate, and the number of clusters capturing part of the event. <b>re-pair? X</b> (raw only) = the SS that pauses most in the current pause window is not step0's rank-1 SS. Second line: depth, firing rate in the reference window, spike count.",
    "Filters: matched / unmatched / in a family / with any CS–CS pair; sort by depth or by phy id.")],
  [/^__header$/, () => H("Identity card of the selected CS.",
    "Line 1: C4 cell-type label, its confidence and votes, manual CS label. Line 2: reference window (the behaviour window selected for this session) spike count and firing rate (and the rate over the full recording); peak channel and depth. Line 3: the CS's <b>stable span</b> — the stretch around the reference window where its rate and amplitude stay stable (see Stability); all pair metrics use the overlap of both units' spans. Line 4: SS candidates with tier, label and pause ratio. Line 5: duplicate family and number of CS–CS pairs with evidence.",
    "")],
  // ----- Overview
  [/^Autocorrelogram \(fine/, () => H("Autocorrelogram of the CS in its stable span, ±" + ms(P.ACG_FINE_WIN) + " ms, " + ms(P.ACG_FINE_BIN) + " ms bins.",
    "For every spike, the times of all other spikes of the same unit within the window; y = rate of those spikes (sp/s) at each lag. The spike itself is excluded. Grey band = ±5 ms.",
    "A clean CS has an empty centre (refractory period, typically ≥ 5–10 ms with almost no counts). Counts at ±1–3 ms mean doublets: the same CS detected twice (spikelets) or contamination by another unit.")],
  [/^Autocorrelogram \(coarse/, () => H("Autocorrelogram of the CS, ±" + ms(P.ACG_COARSE_WIN) + " ms, " + ms(P.ACG_COARSE_BIN) + " ms bins.",
    "Same as the fine ACG on a longer time scale.", "Shows the slow structure of CS firing (≈ 1 Hz, often a weak ~100 ms rhythm). A big central peak at short lags means a contaminated unit.")],
  [/^ISI \(window\)/, () => H("Distribution of inter-spike intervals of the CS in its stable span (log time axis, 1 ms … 5 s).",
    "Interval between consecutive spikes; log-spaced bins. The title gives the share of intervals shorter than " + ms(P.CS_MIN_ISI) + " ms.",
    "For a CS this share should be ≈ 0. A visible bump below 10 ms = double detections or another unit mixed in.")],
  [/^Template, peak ch/, () => H("The sorter's mean waveform (template) of this unit.",
    "Peak channel in colour, neighbouring channels in grey, each trace placed at its channel's position on the probe. Template units as stored by the sorter; spans only ≈ ±1.4 ms around the spike, so later spikelets are not visible here (see Raw data).",
    "Shape and spatial spread of the unit.")],
  [/^Probe map \(purple CS/, () => H("Where this CS sits among its neighbours, ±300 µm around it.",
    "Grey squares = probe channels; large purple dot = this CS; small purple dots = other CS; dark grey = tier-1 SS candidates, light grey = tier-2. Dots are jittered slightly so overlapping units stay visible.",
    "")],
  [/^Probe map \(ringed/, () => H("Probe map around the CS with the selected SS ringed in black.",
    "Same symbols as the Overview probe map: large purple dot = CS, small purple = other CS, dark/light grey = tier-1/tier-2 SS candidates.", "")],
  [/^Amplitude across the recording/, () => H("Amplitude of every CS spike over the whole recording (up to " + P.HTML_MAX_POINTS + " randomly chosen spikes).",
    "Sorter amplitude per spike (template scaling). Grey band = reference window; light purple = the CS's stable span.",
    "Look for drifts, jumps or the unit fading out: a stable unit is a horizontal band. Outside the span the unit is not used.")],
  [/^Stability of/, () => H("How stable the unit is over time, relative to its own reference window.",
    "Recording cut into " + P.STAB_BIN + " s bins. For each bin: firing rate ÷ reference rate (coloured) and median amplitude ÷ reference median amplitude (dark grey), on a log2 axis (0 = same as the reference, ±1 = double / half). A bin is stable if the rate is within ×/÷" + P.STAB_FR_TOL + " (dotted coloured lines) and the amplitude within ×/÷" + P.STAB_AMP_TOL + " (dotted grey). Starting from the reference window, the stable span grows outward bin by bin, only inside the behaviour period (green dashes), tolerating " + P.STAB_MAX_GAP + " isolated unstable bin; red ticks = unstable bins inside behaviour.",
    "Grey = reference window, light purple = resulting stable span. Pair metrics use the overlap of the CS's and the SS's spans.")],
  [/^Firing rate, 30 s bins/, () => H("Firing rate of the CS over the recording, 30 s bins.", "Spike count per bin ÷ 30 s. Grey = reference window, light purple = stable span.", "Slow changes in rate, silent periods, the unit appearing or disappearing.")],
  [/^Sorter drift estimate/, () => H("Probe drift estimated by the spike sorter at the depth of this CS.",
    "The sorter's drift trace (µm) at the depth bin closest to the CS. Grey = reference window, light purple = stable span.",
    "Large drift steps often coincide with amplitude jumps or units being split or merged by the sorter.")],
  // ----- Pairing
  [/^Pairing funnel/, () => H("How many SS units survive each candidate criterion, applied cumulatively.",
    "Starts from every SS unit tested against this CS (tier 1 + tier 2), then keeps those with " + PR_DEF() + " below " + P.CAND_PAUSE_RATIO_MAX + ", then asym > " + P.CAND_ASYM_MIN + ", then jitter p < " + P.CAND_JITTER_P_MAX + ", then no collision dip; the last row also requires that no other CS claims the same SS (display only, not part of the candidate rule). Purple = tier 1, grey = tier 2.",
    "Shows which criterion removes most units.")],
  [/^Criteria per SS/, () => H("Every criterion for the SS units of this CS (top N by the chosen ranking; ★ = candidate). Below the top N, any other SS that ranks #1 or #2 on pause, asym, jitter z, distance or the raw 3–8 ms pause is added, with a tag saying why, so no ranking can hide it.",
    "<b>Required (all four):</b> <b>pause</b>: " + PR_DEF() + "; pass < " + P.CAND_PAUSE_RATIO_MAX + ". <b>asym</b>: mirror ratio (same window before the CS) − pause ratio; pass > " + P.CAND_ASYM_MIN + " (the dip must be after the CS, not symmetric). <b>jitter p</b>: each CS spike is moved by a random amount (uniform ±" + ms(P.JITTER_HALF) + " ms), " + P.N_SURR + " times; p = share of shuffles with as few SS spikes in " + PW() + " as observed; pass < " + P.CAND_JITTER_P_MAX + ". <b>no dip</b>: no collision dip — the fine CCG is below half its baseline on both sides of 0 (±" + ms(P.DIP_HALF) + " ms) while the coarse CCG after 1 ms is ≥ 0.8× baseline (the sorter cannot detect overlapping spikes; that gap is not a pause).<br>" +
    "<b>Information only (grey headers):</b> <b>blocks max</b> = worst pause ratio across " + P.BLOCK_LEN / 60 + "-min blocks; <b>dur50</b> = time from the pause minimum until the SS rate is back at 50% of baseline; <b>zero peak</b> = fine-CCG rate within ±" + ms(P.ZERO_WIN[1]) + " ms ÷ fine baseline (a peak = spikes shared with the CS); <b>Lussac</b> = alternative test (median rate in the pause window < " + P.LUSSAC_FRAC + "× baseline median, and not in the mirror window); <b>CS shared</b> = share of CS spikes with an SS spike within ±" + ms(P.ZERO_WIN[1]) + " ms, minus Poisson chance (✗ > " + P.CS_SHARE_FLAG + "); <b>CS event</b> = share of CS events (" + ms(P.EVENT_WIN[0]) + "…+" + ms(P.EVENT_WIN[1]) + " ms) containing an SS spike, minus chance (✗ > " + P.CS_EVENT_FLAG + "); <b>pr 0–8 (v5)</b> = pause ratio in the old 0–8 ms window.<br>" +
    "<b>claimed by</b> = all CS for which this SS is a candidate. <b>ref ★</b> = candidate when computed in the reference window only (red = differs from the stable-span result). <b>pair window</b> = overlap of both stable spans (s). " + (window.CS_RAW ? "<b>pr 3–8 ⓘ</b> = pause ratio recomputed by the raw layer (# = rank among this CS's SS)." : ""),
    "Green = passes, red = fails. Click a row to open its detail below.")],
  [/^CS event decomposition: CS \d+$/, () => H("No cluster fires inside this CS's event beyond chance.", "See the decomposition table description (Tables tab).", "")],
  [/^CS event decomposition: clusters/, () => H("Clusters whose spikes fall inside this CS's event (" + ms(P.EVENT_WIN[0]) + "…+" + ms(P.EVENT_WIN[1]) + " ms after each CS spike) more often than chance — i.e. clusters that carry a piece of the CS.",
    "For every cluster within " + P.EVENT_NEIGH_UM + " µm: <b>CS events with a spike</b> = share of CS spikes followed by ≥ 1 spike of the cluster in that window; <b>chance</b> = Poisson probability from the cluster's overall rate; <b>excess</b> = the difference (listed if ≥ " + P.EVENT_MIN_EXCESS + " and ≥ " + P.EVENT_MIN_N + " events). <b>own spikes CS-locked</b> = share of the cluster's own spikes that sit in a CS event. <b>lag</b> = median (IQR) time of its first spike in the event. <b>piece</b>: |median lag| ≤ " + ms(P.EVENT_ZERO_LAG) + " ms → zero-lag copy (the main CS spike detected again), later → late piece (spikelet / later component), earlier → earlier piece. <b>strong</b> = excess > " + P.CS_EVENT_FLAG + " or ≥ " + 100 * P.EVENT_LOCKED_MOST + "% of its spikes CS-locked. Weak rows are hidden unless toggled.",
    "Chance is conservative (too high) for units that pause after the CS. A candidate SS that is listed here carries CS pieces; its pause is measured after them (" + PW() + "). Nothing is merged or excluded.")],
  [/^Extra-good units below the tier-1 FR floor/, () => H("Extra-good units that would be SS partners but fire below the tier-1 floor (" + P.SS1_FR_MIN + " Hz) and are therefore never candidates.",
    "Same pause metrics as for candidates; best 6 by pause ratio. <b>would be candidate</b> = passes the four candidate criteria.",
    "Audit only. Switch the floor with SS1_FLOOR / STEP0_SS1_FLOOR (20 or 10 Hz).")],
  [/^CCGs: SS with respect to CS/, () => H("Cross-correlogram of each SS (top N) relative to this CS.",
    "For every CS spike, the SS spikes at each lag; y = SS rate (sp/s). Bin and window from the controls above. Dark shading = pause window " + PW() + "; light = baseline " + BW() + ". Purple title = candidate; ringed = selected.",
    "A partner SS shows a clear dip just after 0 that is absent before 0. Click a CCG to open its detail.")],
  [/^Same cell\? SS/, () => H("Two SS units that are both candidates of this CS (20 Hz or 10 Hz floor, see the title): are they one cell recorded twice (e.g. soma + axon, or a cell split by the sorter), or two cells that the same climbing fibre pauses? A = the faster unit, B = the other. Computed from the raw data (R5 local copy) by ss_same_cell_check.py, inside the overlap of both units' stable spans.",
    "<b>Top left</b>: cross-correlogram, rate of B around A's spikes, ±3 ms, 0.05 ms bins; orange line = B's rate far from A (|lag| ≥ 15 ms); red band = the highest bin within ±1.5 ms ± " + ((window.CS_SSPAIR || {}).coinc_ms || 0.2) + " ms (the 'with' events). <b>Top right</b>: the same CCG at ±30 ms, 0.5 ms bins (black), with each unit's autocorrelogram (purple A, blue B), all divided by their own baseline. <b>Middle</b>: mean raw waveform (300 Hz high-pass, common median reference) on a strip of channels covering both units (one per 20 µm depth row plus each unit's 3 largest; purple = A's, blue = B's), at 0 = the trigger spike, for up to " + ((window.CS_SSPAIR || {}).n_ev || 1500) + " random events of each group: A with B (B at the peak lag), A without B (no B within ±1.5 ms), B with A, B without A; grey = random times. <b>Bottom</b>: per single event, the amplitude of B's mean waveform (on B's 3 channels, −0.5…+1 ms) that fits the raw signal best at A + lag (± 0.2 ms), and the reverse; 1 = a full-size spike, 0 = nothing; histograms normalised, medians in the legend.",
    "<b>Soma + axon / same spikes at two sites</b>: sharp CCG peak at a fixed small lag far above the orange line, many 'with' events above chance, and A spikes <i>without</i> a detected B still carry B's waveform (red histogram near 1, B's channels not flat in 'A without B'). <b>One cell split by the sorter</b> (other spikes): the CCG copies the ACGs (refractory dip at 0), both units have the same waveform on the same channels. <b>Two cells</b>: flat CCG around 0, 'with' at chance, red histogram = black (random), each unit's channels flat when only the other fires. The reading line is a simple rule (signature excess > 0.4 → same cell?; peak > 3× with > 20% excess → duplicate; CCG within ±1 ms < 0.5× → same cell, split) — look at the plots.")],
  [/^Detail: CS/, () => H("Summary of the selected CS→SS pair.",
    "Line 1: ✓/✗ for every criterion (see Criteria per SS). Line 2: pair window = overlap of both stable spans, spike counts; result in the reference window alone. CS-spike sharing: share of CS spikes with an SS spike within ±" + ms(P.ZERO_WIN[1]) + " ms vs chance, and share of the SS's spikes sitting on a CS (red = flag). CS event: same for the whole event window (" + ms(P.EVENT_WIN[0]) + "…+" + ms(P.EVENT_WIN[1]) + " ms). v5 window: the old 0–8 ms values. Last line: lag of the deepest pause bin, time to recover to 50% / 80% of baseline, jitter z-score, jitter deficit (1 − observed / shuffled SS count; 1 = complete pause) and the SS baseline rate.",
    "Flags never change the candidate decision.")],
  [/^Coarse CCG ±50 ms/, () => H("SS rate around each CS spike, ±50 ms, 1 ms bins.", "Dark shading = pause window " + PW() + "; light = baseline " + BW() + ".", "Expect a dip right after 0 (≈ 10–20 ms for a real CS→SS pause) and a flat baseline before 0.")],
  [/^Fine CCG ±10 ms/, () => H("SS rate around each CS spike, ±" + ms(P.FINE_WIN) + " ms, " + ms(P.FINE_BIN) + " ms bins. Dashed line = 0.",
    "Same as the coarse CCG at high time resolution.",
    "A narrow peak at 0 = the SS unit contains CS spikes (shared detections). A symmetric gap of ±0.5 ms around 0 = collision dip (the sorter misses overlapping spikes), not a pause.")],
  [/^Fine CCG$/, () => H("Fine CCG not stored for this pair.", "Only candidates and top-ranked SS are exported to keep the page small.", "")],
  [/^Autocorrelogram SS/, () => H("Autocorrelogram of the SS, ±" + ms(P.ACG_FINE_WIN) + " ms, " + ms(P.ACG_FINE_BIN) + " ms bins.", "Same method as the CS fine ACG.", "A good SS (tens of Hz) has a short refractory gap (≈ 1–3 ms) and no peak at 0.")],
  [/^Template SS/, () => H("Sorter template of the SS (peak channel dark, neighbours grey, placed like the probe).", "Template units as stored by the sorter, ≈ ±1.4 ms.", "")],
  [/^Per-block pause ratio/, () => H("Pause ratio of this pair in consecutive " + P.BLOCK_LEN / 60 + "-minute blocks of the pair window.",
    "Same pause ratio as the main one, but with CS spikes and SS spikes from one block only (blocks with < 20 CS spikes are left out). Solid line at 1 = no pause; dotted = candidate threshold " + P.CAND_PAUSE_RATIO_MAX + ".",
    "A real partner pauses in every block. A pause in only some blocks = unstable unit or a sorter split over time.")],
  [/^Per-block CCGs/, () => H("The CCG of each block, overlaid (colour = block start, minutes).", "Same bins as the coarse CCG; shading = pause window " + PW() + ".", "Check that the dip is present in all blocks.")],
  [/^Raw data: mean waveform of SS/, () => H("Mean of the SS's raw recording around its own spikes, −2…+8 ms.",
    "Up to " + (RM().n_mean || 500) + " random spikes in its stable span; raw AP band, " + (RM().hp_hz || 300) + " Hz high-pass, common median reference, µV. One small trace per channel within ±100 µm of the peak, placed like the probe; peak channel dark. Thin vertical line = spike time.",
    "Shows the full SS waveform, beyond the sorter template.")],
  [/CS-locked spikes vs its other spikes/, () => H("Does this unit fire its own spikes, or does it pick up pieces of a CS?",
    "The unit's spikes are split into <b>CS-locked</b> (red: " + (RM().capture_win_ms ? RM().capture_win_ms[0] + "…+" + RM().capture_win_ms[1] : "−0.5…+4") + " ms after a spike of a CS whose event it captures) and <b>all others</b> (grey). Raw mean of each set (up to " + (RM().n_mean || 500) + " spikes), aligned on the unit's own spike time, on its 8 largest channels. Common voltage scale; two columns of channels (by depth, left first).",
    "Same shape → the CS-locked spikes are this unit's own spikes that happen to follow the CS. Different shape (e.g. the CS waveform or a spikelet) → those spikes are pieces of the CS assigned to this cluster by the sorter.")],
  // ----- Duplicates
  [/^Duplicate evidence$/, () => H("No CS–CS pair with a duplicate flag or a sharp CCG peak involves this CS.", "", "")],
  [/^Evidence votes/, () => H("Are two CS units the same cell? One column per partner CS (* = duplicate candidate: > " + P.DUP_COINC_MIN + " of the smaller unit's spikes coincide with the other's at the CCG peak lag).",
    "Each row is one independent line of evidence; each votes +1 (same cell, green), −1 (different cells, red) or 0 (grey, not informative / not testable). Hover each row's ⓘ for its exact rule. <b>coincidence</b> = share of the smaller unit's spikes with a partner within ±" + ms(P.COINC_DELTA) + " ms of the peak lag. <b>lag jitter</b> = robust SD of that lag. <b>union ISIs</b> = new " + ms(P.UNION_ISI_RANGE[0]) + "–" + ms(P.UNION_ISI_RANGE[1]) + " ms intervals created by merging, ÷ the number expected for independent trains (one cell cannot fire two CS that close). <b>shared SS</b> = both pause the same SS. <b>co-silencing</b> = pause of one unit's own SS after the OTHER unit's non-coincident spikes. <b>footprint</b> = cosine of the template peak-to-peak across channels. <b>amp/depth covar</b> = correlation of the coincident spikes' amplitudes or depths (detrended per " + P.DETREND_BIN + " s).",
    "votes = +support / −against; status: converges (≥ " + P.EV_CONVERGE_MIN + " one way, none the other), leans, conflicting or insufficient. Nothing is ever merged. Click a column to select the pair.")],
  [/^Decision path/, () => H("Which descriptive type the pair falls into (highlighted path).",
    "<b>Tight lock</b>: lag SD ≤ " + ms(P.EV_LAG_SD[0]) + " ms and coincidence ≥ " + P.EV_COINC[0] + ". Then |lag| ≤ " + ms(P.COINC_DELTA) + " ms → <b>same-event re-detection</b> (one spike detected twice); otherwise → <b>fixed-lag component</b> (a later piece of the same event, e.g. a spikelet). Not tight: lag SD ≥ " + ms(P.EV_LAG_SD[1]) + " ms or different SS partners → <b>synchrony-like</b> (two cells firing together); else <b>unclear</b>. <b>Partial split</b> check: coincidence " + P.EV_COINC[1] + "–0.9 and slow rates or amplitudes anti-correlated (one cluster takes over from the other). Bottom box: votes and status.",
    "A type is a description, not a decision: every pair goes to manual review.")],
  [/^Selected pair/, () => H("Numbers of the selected CS–CS pair (lags are of the second unit relative to the first).",
    "Pair window (overlap of both stable spans); coincidence in the reference window; CCG peak lag and width (FWHM); distance; spike counts split into coincident / first-only / second-only; SS partners of each; union: new short ISIs vs expected; doublets = share of each unit's own ISIs < " + ms(P.DOUBLET_ISI) + " ms; ss_cond = pause of each partner SS after the other unit's non-coincident spikes; SS pause after the coincident spikes; family; status.",
    "")],
  [/^Waveforms side by side/, () => H("Sorter templates of the two CS: the first (purple) at its spike time, the second (blue) shifted by the measured CCG peak lag, on shared channels.",
    "Rows = channels (◆ = each unit's peak channel), same scale for both. Blue bands = spread of the second unit's spike time around the peak lag (dark = IQR, light = 10–90%). Option: dashed black = sum of both.",
    "Re-detection: the blue trace sits on the purple main deflection. Fixed-lag component: blue sits on a separate, later deflection. Templates cover only ≈ ±1.4 ms; later pieces need the raw means below.")],
  [/^Single raw events of CS/, () => H("Individual events of the CS–CS pair, not averaged: does the second unit fire as a separate, later piece of the same event as the first (spikelet), are the two detections of one spike, or are they two cells?",
    "The pair is ordered so that the <b>first</b> unit fires first at the CCG peak. <b>both</b> = events of the first unit with a spike of the second within the peak lag ± " + ms(P.COINC_DELTA) + " ms; <b>X only</b> = events without a partner (second-only snippets are shifted so its spike sits at the peak lag, same time frame). Up to 40 'both' and 15 of each single type, chosen at random. Raw traces " + ((window.CS_RAW_DUPEV || {}).win_ms || [-3, 10]).join("…+") + " ms around the first unit's spike, on the 2 largest channels of each unit (columns; coloured header = that unit's peak channel), " + (RM().hp_hz || 300) + " Hz high-pass, common median reference. One row per event, sorted by the measured lag; left = time of the event in the recording. Top tick (purple) = every spike of the first unit inside the window; bottom tick (blue) = every spike of the second unit. Each channel has its own scale (median peak-to-peak of the shown events). Right: lag of the second unit in ALL 'both' events. Top numbers: peak lag, counts, and the share of 'both' events containing a further spike of either unit (repeated detections).",
    "<b>Spikelet</b>: the second unit's tick sits on a separate, later deflection that follows the main spike in every 'both' row, and the first-only rows lack it (or show it without a tick). <b>Same spike detected twice</b>: both ticks sit on the same deflection (lag ≈ 0). <b>Two cells</b>: the deflections differ in shape or channel and the lag varies from row to row.")],
  [/^Raw means: CS|^Raw: \d+ \/ \d+/, () => H("Raw-data mean waveforms of the two CS, with events split into three groups.",
    "<b>coincident</b> (black) = events where both units fired (within ±" + ms(P.COINC_DELTA) + " ms of the peak lag); <b>first-only</b> (purple) = only the first unit; <b>second-only</b> (blue) = only the second, shifted by the peak lag so all three line up with the first unit. Up to " + (RM().n_mean || 500) + " events per group (≥ 20 needed), raw AP band, " + (RM().hp_hz || 300) + " Hz high-pass, common median reference, −2…+8 ms. Channels = union of both units' 6 largest channels, by depth, in two columns, one common voltage scale. Top numbers: coincidence, peak lag, cosine similarity of the two units' full means (all and after 1.5 ms only), step0 evidence status.",
    "Same waveform in all three → one cell detected twice. The coincident mean has an extra late part the singles lack → the two clusters split one event into pieces. Single-unit means on different channels → two cells.")],
  [/^Fine CCG: \d+ relative to/, () => H("Fine cross-correlogram between the two CS, ±" + ms(P.FINE_WIN) + " ms, " + ms(P.FINE_BIN) + " ms bins.", "y = rate of the second unit around each spike of the first. Shaded = ±" + ms(P.COINC_DELTA) + " ms around the peak lag (the coincidence window).", "A tall narrow peak = the two units fire together at a fixed lag.")],
  [/^Lag jitter/, () => H("Spread of the lag between coincident spikes.", "For each spike of the first unit, the nearest spike of the second within ±" + ms(P.LAG_SPREAD_WIN) + " ms of the peak lag; histogram of its offset from the peak lag. Robust SD = 1.4826 × median absolute deviation.", "Very narrow (≤ " + ms(P.EV_LAG_SD[0]) + " ms) = locked to the same event; broad (≥ " + ms(P.EV_LAG_SD[1]) + " ms) = loose synchrony of two cells.")],
  [/^Rates over time/, () => H("Firing rates of both CS and of their coincident spikes over the pair window, " + P.DETREND_BIN + " s bins.", "purple = first unit, blue = second, black = coincident spikes. Title: correlation of the two rates.", "Anti-correlated rates (one goes up when the other goes down) suggest the sorter hands one cell over between two clusters.")],
  [/^CS→SS CCGs: /, () => H("For each SS partner of either CS of the pair: the CCG of CS A → that SS (purple) and of CS B → the same SS (blue), overlaid. If neither CS has a candidate, each CS's rank-1 SS is shown.",
    "The step0 coarse CCG of each CS×SS pair (all spikes of the CS in that pair's window = overlap of the CS's and the SS's stable spans), ±50 ms, 1 ms bins, each divided by its own baseline (mean " + BW() + ") so the two CS are comparable even if their windows or rates differ. Light band = baseline, dark band = pause window " + PW() + ", line at 1 = baseline. Below each plot: the step0 metrics of each CS with that SS (★ = candidate; rank among that CS's SS; window).",
    "Same cell detected twice → both CS pause the same SS with the same depth, onset and duration. A fixed-lag piece (spikelet) → same pause, shifted by the lag between the two CS. Two cells → only one CS pauses this SS, or the pauses differ clearly. For all spikes together this view cannot separate the units' coincident and non-coincident spikes: see Co-silencing for that.")],
  [/^Co-silencing/, () => H("Do both CS silence the same SS?",

    "If the second unit's spikes alone still silence the first unit's SS, the two are probably one cell.")],
  [/^Template footprints/, () => H("Where on the probe each CS template has signal.", "Template peak-to-peak per channel ÷ its own maximum, maximum per depth, against probe depth; purple = first, blue = second. Shaded = depths where both footprints exceed " + P.FOOTPRINT_FRAC + " of their maximum. Title: number of shared channels and cosine similarity (needs ≥ " + P.FOOTPRINT_MIN_OVERLAP + " shared channels).", "Same profile = same source location; offset profiles = different cells (or different compartments).")],
  [/of coincident spikes/, () => H("For the coincident spikes only: one value of the first unit vs the second.", "Sorter amplitude (or spike depth) per spike, with the per-" + P.DETREND_BIN + " s median removed from each (detrended, so common drift does not create a correlation); up to " + P.HTML_MAX_POINTS + " points. Title: correlation r.", "Positive correlation → both clusters see the same spike fluctuating together (same cell).")],

        ` show weak pieces too (${all.length - all.filter(r => r.strong || r.is_ss_candidate || r.is_cs_unit).length} more; excess ≤ ${P.CS_EVENT_FLAG} and < ${100 * P.EVENT_LOCKED_MOST}% CS-locked)`)),
      el("div", { class: "table-wrap" }, tb),
      el("div", { class: "note" }, `From spike times only; nothing merged or excluded. Lag ≈ 0 (|median| ≤ ${P.EVENT_ZERO_LAG * 1e3} ms) = zero-lag copy (re-detection of the main spike); later lag = later piece (spikelet / late component). ` +
        `Red "own spikes CS-locked" ≥ ${100 * P.EVENT_LOCKED_MOST}% = most of the cluster is CS pieces. Red status = an SS candidate of this CS that also carries pieces of its event: its pause is measured at ${P.PAUSE_WIN[0] * 1e3}–${P.PAUSE_WIN[1] * 1e3} ms, after them. ` +
        `Chance uses the cluster's overall rate, so a unit that pauses after the CS gets a conservative (low) excess.`)), "wide");
}
function lowfrCard(cs) {
  const rows = LOWFR.filter(r => r.cs === cs).sort((a, b) => a.pause_ratio - b.pause_ratio).slice(0, 6);
  if (!rows.length) return null;
  const tb = el("table");
  tb.append(el("tr", {}, ...["SS (excluded)", "FR", "d µm", `pause ${P.PAUSE_WIN[0] * 1e3}–${P.PAUSE_WIN[1] * 1e3}`, "pr 0–8 (v5)", "asym", "jitter p", "CS event", "would be candidate"].map(h => el("th", {}, h))));
  for (const r of rows) tb.append(el("tr", {}, el("td", { style: "font-weight:600" }, r.ss), el("td", {}, fmt(r.ss_fr, 1)), el("td", {}, fmt(r.dist_um, 0)),
    el("td", { class: r.pause_ratio < P.CAND_PAUSE_RATIO_MAX ? "plus" : "" }, fmt(r.pause_ratio)), el("td", {}, fmt(r.pause_ratio_0_8)), el("td", {}, fmt(r.asym)),
    el("td", {}, fmt(r.jitter_p, 3)), el("td", {}, fmt(r.cs_event_excess)), el("td", { class: r.would_be_candidate ? "minus" : "" }, r.would_be_candidate ? "yes" : "no")));
  return card(`Extra-good units below the tier-1 FR floor (${P.SS1_FR_MIN} Hz): excluded, shown for audit (best 6 by pause)`, el("div", { class: "table-wrap" }, tb), "wide");
}

// ---------- Tables ----------
function sortableTable(rows, cols, { onRow, selKey } = {}) {
  const tb = el("table"), head = el("tr");
  cols.forEach(c => head.append(el("th", { style: "cursor:pointer", onclick: () => { S.sortasc = S.sortk === c ? !S.sortasc : true; S.sortk = c; render(); } },
    c + (S.sortk === c ? (S.sortasc ? " ▲" : " ▼") : ""))));
  tb.append(head);
  const rs = [...rows]; if (S.sortk && cols.includes(S.sortk)) rs.sort((a, b) => {
    const x = a[S.sortk], y = b[S.sortk]; const r = (x === null) - (y === null) || (x < y ? -1 : x > y ? 1 : 0); return S.sortasc ? r : -r; });
  rs.forEach(r => tb.append(el("tr", { class: onRow ? "click" : "", onclick: onRow ? () => onRow(r) : null },
    ...cols.map(c => el("td", {}, Array.isArray(r[c]) ? r[c].join(",") : typeof r[c] === "number" ? fmt(r[c], Number.isInteger(r[c]) ? 0 : 3) : fmt(r[c]))))));
  return el("div", { class: "table-wrap" }, tb);
}
function renderTables(M, cs) {
  const g = el("div", { class: "grid" });
  let rows = Object.values(D.pairs); if (S.tcand) rows = rows.filter(p => p.candidate); if (S.tthis) rows = rows.filter(p => p.cs === cs);
  const pcols = ["cs", "ss", "rank", "candidate", "ss_tier", "ss_group", "ss_c4", "pause_ratio", "asym", "pause_dur50_ms", "jitter_p", "jitter_deficit",
                 "block_pr_max", "collision_dip", "zero_peak_ratio", "lussac_pass", "cs_share_excess", "cs_share_flag",
                 ...(V6 ? ["cs_event_excess", "ss_cs_locked_frac", "cs_event_flag", "pause_ratio_0_8", "asym_0_8"] : []), "dist_um", "ss_fr", "win_start", "win_end", "n_cs",
                 "candidate_ref", "pause_ratio_ref", "jitter_p_ref", "n_cs_ref"];
  const ctl = el("div", { class: "ctl" },
    el("label", {}, el("input", { type: "checkbox", ...(S.tcand ? { checked: "" } : {}), onchange: e => go({ tcand: e.target.checked }) }), " candidates only"),
    el("label", {}, el("input", { type: "checkbox", ...(S.tthis ? { checked: "" } : {}), onchange: e => go({ tthis: e.target.checked }) }), ` CS ${cs} only`),
    el("span", { class: "hint" }, `${rows.length} rows · click a header to sort · click a row to open it in Pairing`));
  g.append(card("CS × SS pairs", el("div", {}, ctl, sortableTable(rows, pcols, { onRow: r => go({ tab: "pairing", cs: r.cs, ss: r.ss }) })), "wide"));
  const dcols = ["family", "cs_a", "cs_b", "dup_candidate", "evidence_status", "type_hint", "n_support", "n_against", "support", "against",
                 "coinc_frac_peak", "peak_lag_ms", "lag_sd_ms", "union_new_ratio", "ss_shared", "ss_cond_pr_min", "footprint_cos", "amp_corr_detr", "depth_corr_detr", "dist_um", "win_start", "win_end", "coinc_frac_peak_ref"];
  g.append(card("CS – CS evidence (click a row to open it in Duplicates)", sortableTable(D.dups, dcols, { onRow: r => go({ tab: "duplicates", cs: r.cs_a, pair: r.cs_b }) }), "wide"));
  if (V6) {
    const drows = S.tthis ? decompOf(cs) : DECOMP;
    g.append(card(`CS event decomposition (${drows.length} rows${S.tthis ? `, CS ${cs}` : ", all CS"}; click a row to open the CS)`, sortableTable(drows,
      ["cs", "unit", "role", "group", "c4", "fr", "dist_um", "n_cs", "n_hit", "frac_cs_events", "chance", "excess", "unit_locked_frac", "lag_med_ms", "lag_q25_ms", "lag_q75_ms",
       "piece", "mostly_cs_pieces", "is_cs_unit", "is_ss_candidate", "is_rank1_ss"], { onRow: r => go({ tab: "pairing", cs: r.cs }) }), "wide"));
    const lrows = (S.tthis ? LOWFR.filter(r => r.cs === cs) : LOWFR).filter(r => !S.tcand || r.would_be_candidate);
    g.append(card(`Tier-1 units below the FR floor (${P.SS1_FR_MIN} Hz), excluded (${lrows.length} rows; "candidates only" = would have been a candidate)`,
      sortableTable(lrows, ["cs", "ss", "ss_fr", "pause_ratio", "pause_ratio_0_8", "asym", "jitter_p", "cs_event_excess", "dist_um", "would_be_candidate"]), "wide"));
  }
  g.append(card("Conflicts (no resolution)", sortableTable(D.conflicts, ["type", "unit", "members", "detail"]), "wide"));
  g.append(card("Duplicate families (not merged)", el("pre", { class: "card-text" }, Object.entries(D.families).map(([k, m]) => `${k}: ${m.join(", ")}`).join("\n") || "none")));
  g.append(card("Session", el("pre", { class: "card-text" }, JSON.stringify(D.meta, null, 1))));
  g.append(card("Parameters used", el("pre", { class: "card-text", style: "max-height:420px;overflow:auto" }, JSON.stringify(P, null, 1)), "span2"));
  M.append(g);
}

// ---------- render + keys ----------
function render() {
  document.getElementById("meta").textContent =
    `${D.meta.mouse} ${D.meta.session_r}/${D.meta.session_s} ${D.meta.imec} · ${D.meta.sorter_type} · reference ${D.meta.window} [${D.meta.t0.toFixed(0)}, ${D.meta.t1.toFixed(0)}] s · stable spans ${D.meta.stable_span ? "on" : "off"} (behaviour ${fmt(D.meta.b0, 0)}–${fmt(D.meta.b1, 0)} s) · ${D.cs_ids.length} CS, ${D.ss_ids.length} SS candidates · built ${D.meta.created}`;
  renderTabs(); renderList();
  const M = document.getElementById("main"); M.innerHTML = "";
  const cs = S.cs;
  ({ overview: renderOverview, pairing: renderPairing, duplicates: renderDuplicates, tables: renderTables,
     raw: RAW ? renderRaw : renderOverview }[S.tab] || renderOverview)(M, cs);
  writeHash();
}
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  const rows = [...document.querySelectorAll(".cs-row")].map(r => +r.querySelector(".id").textContent);
  const i = rows.indexOf(S.cs);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); if (i < rows.length - 1) go({ cs: rows[i + 1], ss: null, pair: null }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); if (i > 0) go({ cs: rows[i - 1], ss: null, pair: null }); }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && S.tab === "pairing") {
    const sp = shownPairs(S.cs), ps = [...sp.top, ...sp.extra.map(x => x.p)].map(p => p.ss), k = ps.indexOf(S.ss);
    go({ ss: ps[Math.max(0, Math.min(ps.length - 1, k + (e.key === "ArrowRight" ? 1 : -1)))] });
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && S.tab === "duplicates") {
    const ps = dupsOf(S.cs).map(d => partner(d, S.cs)), k = ps.indexOf(S.pair);
    go({ pair: ps[Math.max(0, Math.min(ps.length - 1, k + (e.key === "ArrowRight" ? 1 : -1)))] });
  }
});
document.getElementById("f-show").addEventListener("change", renderList);
{ const ic = infoIcon("__sidebar"); if (ic) { ic.classList.add("inline"); document.querySelector("header h1").append(ic); } }
document.getElementById("f-sort").addEventListener("change", renderList);
window.addEventListener("hashchange", () => { readHash(); render(); });
if (D) { readHash(); render(); }
</script>
